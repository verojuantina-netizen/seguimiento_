name: Prueba 5 expedientes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el programa
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: pip install requests beautifulsoup4

      - name: Ejecutar la prueba
        run: python prueba_5_expedientes.py

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          git commit -m "Resultados de la prueba de 5 expedientes" || echo "Sin cambios"
          git push
